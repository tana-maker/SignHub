name: Build SignHub IPA (Cloud Mac)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14 # Free Apple Silicon macOS runner with Xcode pre-installed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project SignHub/SignHub.xcodeproj \
            -scheme SignHubTests \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO || true

      - name: Build iOS Application Archive
        run: |
          xcodebuild archive \
            -project SignHub/SignHub.xcodeproj \
            -scheme SignHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SignHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Payload into SignHub.ipa
        run: |
          mkdir -p build/Payload
          cp -r "build/SignHub.xcarchive/Products/Applications/SignHub.app" build/Payload/
          cd build
          zip -r -y "SignHub.ipa" Payload
          echo "Created SignHub.ipa successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignHub-IPA
          path: build/SignHub.ipa
          retention-days: 14
