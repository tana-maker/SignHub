name: Build SignHub IPA (Cloud Mac)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build SignHub App Bundle
        run: |
          xcodebuild build \
            -project SignHub/SignHub.xcodeproj \
            -scheme SignHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package Payload into SignHub.ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "SignHub.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "SignHub.app" -type d | head -n 1)
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -y "SignHub.ipa" Payload
          echo "SignHub.ipa created successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignHub-IPA
          path: build/SignHub.ipa
          retention-days: 14
