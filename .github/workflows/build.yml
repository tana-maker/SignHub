name: Build SignHub IPA (Cloud Mac)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build iOS Application Archive
        run: |
          xcodebuild archive \
            -project SignHub/SignHub.xcodeproj \
            -scheme SignHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SignHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Payload into SignHub.ipa
        run: |
          mkdir -p build/Payload
          cp -r "build/SignHub.xcarchive/Products/Applications/SignHub.app" build/Payload/
          cd build
          zip -r -y "SignHub.ipa" Payload
          echo "SignHub.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignHub-IPA
          path: build/SignHub.ipa
          retention-days: 14
